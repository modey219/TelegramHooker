name: TelegramHooker
options:
  bundleIdPrefix: com.aseqx12
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  TelegramHooker:
    type: application
    platform: iOS
    sources:
      - TelegramHooker
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: TelegramHooker/Info.plist
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.aseqx12.telegramhooker
        ENABLE_BITCODE: NO
