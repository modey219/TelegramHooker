<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Hooker - License Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a14; color: #fff; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 24px; }
        h1 { color: #40A8FF; font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: #666; margin-bottom: 24px; }
        .card { background: #12121f; border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid #1a1a2e; }
        .card h2 { color: #40A8FF; font-size: 16px; margin-bottom: 16px; }
        input, select { background: #1a1a2e; border: 1px solid #2a2a3e; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 14px; width: 100%; margin-bottom: 10px; outline: none; }
        input:focus, select:focus { border-color: #40A8FF; }
        button { background: #40A8FF; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #3090E0; }
        button.danger { background: #FF4D4D; }
        button.danger:hover { background: #E03030; }
        .row { display: flex; gap: 10px; }
        .row > * { flex: 1; }
        .result { background: #0d1a0d; border: 1px solid #1a3a1a; border-radius: 8px; padding: 14px; margin-top: 12px; color: #4DFF88; font-family: monospace; word-break: break-all; display: none; }
        .result.error { background: #1a0d0d; border-color: #3a1a1a; color: #FF4D4D; }
        .result.show { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #1a1a2e; font-size: 13px; }
        th { color: #40A8FF; font-weight: 600; }
        td { color: #ccc; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge.active { background: #1a3a1a; color: #4DFF88; }
        .badge.expired { background: #3a1a1a; color: #FF4D4D; }
        .badge.revoked { background: #3a2a1a; color: #FFD700; }
        #loading { text-align: center; color: #666; padding: 20px; }
        .generated-code { font-size: 20px; font-weight: bold; color: #4DFF88; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TELEGRAM HOOKER - Admin Panel</h1>
        <p class="subtitle">@ASEQX12 - License Management</p>

        <div class="card">
            <h2>Generate New Code</h2>
            <div class="row">
                <div>
                    <label style="color:#888;font-size:12px;">Max Devices</label>
                    <input type="number" id="maxDevices" value="1" min="1" max="100">
                </div>
                <div>
                    <label style="color:#888;font-size:12px;">Expires (days, 0=never)</label>
                    <input type="number" id="days" value="30" min="0">
                </div>
            </div>
            <input type="text" id="note" placeholder="Note (optional) - e.g. VIP user">
            <button onclick="generateCode()">GENERATE CODE</button>
            <div id="genResult" class="result"></div>
        </div>

        <div class="card">
            <h2>Revoke Code</h2>
            <input type="text" id="revokeCode" placeholder="Enter code to revoke (TH-XXXX-XXXX-XXXX)">
            <button class="danger" onclick="revokeCode()">REVOKE</button>
            <div id="revokeResult" class="result"></div>
        </div>

        <div class="card">
            <h2>All Licenses</h2>
            <button onclick="loadLicenses()" style="margin-bottom:12px;background:#2a2a3e;">REFRESH</button>
            <div id="loading">Loading...</div>
            <table id="licenseTable" style="display:none;">
                <thead>
                    <tr><th>Code</th><th>Devices</th><th>Expires</th><th>Status</th><th>Note</th></tr>
                </thead>
                <tbody id="licenseBody"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ====== CONFIG ======
        const SUPABASE_URL = 'https://wsvvxmsgarpwbjbbskar.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzdnZ4bXNnYXJwd2JqYmJza2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNDIyNTMsImV4cCI6MjEwMjgxODI1M30.Ds2Xi3Q5P6HIF4mG2TrsLQlqxeww80V8LHWzt9fQRA8';
        // ====================

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showResult(id, msg, isError) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.className = 'result show' + (isError ? ' error' : '');
        }

        async function generateCode() {
            const maxDevices = parseInt(document.getElementById('maxDevices').value) || 1;
            const days = parseInt(document.getElementById('days').value) || 0;
            const note = document.getElementById('note').value || '';

            try {
                const { data, error } = await supabase.rpc('generate_license', {
                    p_max_devices: maxDevices,
                    p_days: days,
                    p_note: note
                });
                if (error) throw error;

                const code = data.code;
                showResult('genResult', `Code: ${code}\nMax Devices: ${data.max_devices}\nExpires: ${data.expires_at || 'Never'}`, false);
                document.getElementById('note').value = '';
                loadLicenses();
            } catch (e) {
                showResult('genResult', 'Error: ' + e.message, true);
            }
        }

        async function revokeCode() {
            const code = document.getElementById('revokeCode').value.trim();
            if (!code) { showResult('revokeResult', 'Enter a code first', true); return; }

            try {
                const { data, error } = await supabase.rpc('revoke_license', { p_code: code });
                if (error) throw error;
                showResult('revokeResult', data.message || 'Revoked!', false);
                document.getElementById('revokeCode').value = '';
                loadLicenses();
            } catch (e) {
                showResult('revokeResult', 'Error: ' + e.message, true);
            }
        }

        async function loadLicenses() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('licenseTable').style.display = 'none';

            try {
                const { data, error } = await supabase.from('licenses').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                const body = document.getElementById('licenseBody');
                body.innerHTML = '';
                for (const lic of (data || [])) {
                    const isExpired = lic.expires_at && new Date(lic.expires_at) < new Date();
                    const status = !lic.is_active ? 'Revoked' : isExpired ? 'Expired' : 'Active';
                    const badge = !lic.is_active ? 'revoked' : isExpired ? 'expired' : 'active';
                    const expires = lic.expires_at ? new Date(lic.expires_at).toLocaleDateString() : 'Never';
                    body.innerHTML += `<tr>
                        <td style="font-family:monospace;color:#40A8FF;">${lic.code}</td>
                        <td>${lic.active_devices}/${lic.max_devices}</td>
                        <td>${expires}</td>
                        <td><span class="badge ${badge}">${status}</span></td>
                        <td>${lic.note || ''}</td>
                    </tr>`;
                }
                document.getElementById('loading').style.display = 'none';
                document.getElementById('licenseTable').style.display = 'table';
            } catch (e) {
                document.getElementById('loading').textContent = 'Error: ' + e.message;
            }
        }

        loadLicenses();
    </script>
</body>
</html>
