name: Build iOS IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install dependencies
        run: |
          brew install carthage || true
          gem install cocoapods || true

      - name: Select iPhone Simulator
        run: |
          xcodebuild -showsdks | grep -i "iphoneos" | head -3

      - name: Build IPA (Release)
        run: |
          cd ios
          xcodebuild \
            -project TelegramHooker.xcodeproj \
            -scheme TelegramHooker \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/TelegramHooker.xcarchive \
            archive \
            | xcpretty || true

          xcodebuild \
            -exportArchive \
            -archivePath build/TelegramHooker.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ || true

          ls -la build/ 2>/dev/null

      - name: Create IPA
        run: |
          cd ios
          mkdir -p Payload
          if [ -d build/TelegramHooker.app ]; then
            cp -r build/TelegramHooker.app Payload/
            zip -r ../TelegramHooker-iOS.ipa Payload
          elif [ -d build/TelegramHooker.xcarchive/Products/Applications/TelegramHooker.app ]; then
            cp -r build/TelegramHooker.xcarchive/Products/Applications/TelegramHooker.app Payload/
            zip -r ../TelegramHooker-iOS.ipa Payload
          else
            echo "No app bundle found"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramHooker-iOS
          path: TelegramHooker-iOS.ipa
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: TelegramHooker-iOS.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
