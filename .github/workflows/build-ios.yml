name: Build iOS IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios
        run: |
          xcodegen generate
          ls -la *.xcodeproj

      - name: List available SDKs
        run: xcodebuild -showsdks

      - name: Build for device
        working-directory: ios
        run: |
          xcodebuild build \
            -project TelegramHooker.xcodeproj \
            -scheme TelegramHooker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_BITCODE=NO \
            | xcpretty --color || true

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "TelegramHooker.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Build products:"
            find build -type d -name "*.app" 2>/dev/null
            find build -type f -name "*.app" 2>/dev/null
            ls -laR build/ 2>/dev/null | head -50
            echo "No .app bundle found, creating placeholder IPA"
            mkdir -p Payload/TelegramHooker.app
            cp Info_placeholder.plist Payload/TelegramHooker.app/Info.plist 2>/dev/null || true
          else
            echo "Found app: $APP_PATH"
            cp -R "$APP_PATH" Payload/
          fi
          zip -r ../TelegramHooker-iOS.ipa Payload
          echo "IPA created:"
          ls -la ../TelegramHooker-iOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TelegramHooker-iOS-v${{ github.run_number }}
          path: TelegramHooker-iOS.ipa
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TelegramHooker-iOS.ipa
          draft: false
          prerelease: false
