name: Build iOS IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate --spec project.yml
          echo "Generated project:"
          ls -la TelegramHooker.xcodeproj/

      - name: Show schemes
        run: |
          cd ios
          xcodebuild -project TelegramHooker.xcodeproj -list

      - name: Build iOS (No Code Sign)
        run: |
          cd ios
          xcodebuild build \
            -project TelegramHooker.xcodeproj \
            -scheme TelegramHooker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build.log

      - name: Package IPA
        run: |
          cd ios
          mkdir -p Payload
          APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "Found: $APP"
            cp -R "$APP" Payload/
            cd ..
            zip -r -y TelegramHooker-iOS.ipa Payload
            echo "IPA: $(du -h TelegramHooker-iOS.ipa | cut -f1)"
          else
            echo "=== BUILD LOG (last 80 lines) ==="
            tail -80 ios/build.log 2>/dev/null || true
            echo "=== Build products ==="
            find ios/build -type f 2>/dev/null | head -20
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TelegramHooker-iOS-v${{ github.run_number }}
          path: TelegramHooker-iOS.ipa
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TelegramHooker-iOS.ipa
          draft: false
          prerelease: false
