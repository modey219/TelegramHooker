name: Build Native ntgcalls for Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'recipes/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r25b" >> $GITHUB_ENV
          echo "NDK=$PWD/android-ndk-r25b" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build python3-dev python3-pip

      - name: Clone sources
        run: |
          git clone --recursive https://github.com/pytgcalls/ntgcalls.git /tmp/ntgcalls
          cd /tmp/ntgcalls
          git submodule update --init --recursive

      - name: Build opus for Android ARM64
        run: |
          git clone https://github.com/xiph/opus.git /tmp/opus
          cd /tmp/opus
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DOPUS_BUILD_PROGRAMS=OFF \
            -DOPUS_BUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=/tmp/opus-install
          cmake --build . --parallel $(nproc)
          cmake --install .

      - name: Build tgcalls for Android ARM64
        run: |
          cd /tmp/ntgcalls/tgcalls
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_PREFIX_PATH=/tmp/opus-install \
            -DCMAKE_INSTALL_PREFIX=/tmp/tgcalls-install
          cmake --build . --parallel $(nproc)
          cmake --install .

      - name: Build ntgcalls Python extension
        run: |
          cd /tmp/ntgcalls
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_PREFIX_PATH="/tmp/opus-install;/tmp/tgcalls-install" \
            -DPYTHON_EXECUTABLE=$(which python3)
          cmake --build . --parallel $(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p /tmp/artifacts
          find /tmp/ntgcalls/build -name "*.so" -exec cp {} /tmp/artifacts/ \;
          find /tmp/ntgcalls/build -name "*.pyd" -exec cp {} /tmp/artifacts/ \;
          ls -lh /tmp/artifacts/

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: ntgcalls-android-arm64
          path: /tmp/artifacts/
          retention-days: 30
