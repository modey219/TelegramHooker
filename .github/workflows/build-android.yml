name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget \
            openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython virtualenv

      - name: Show buildozer config
        run: |
          echo "=== buildozer.spec ==="
          cat buildozer.spec
          echo "=== main.py exists? ==="
          ls -la main.py

      - name: Build APK
        run: buildozer --verbose android debug 2>&1 | tee build.log

      - name: Find APK
        id: find_apk
        run: |
          echo "=== Searching for APK ==="
          find . -name "*.apk" -exec ls -lh {} \; 2>/dev/null || true
          APK=$(find . -name "*.apk" -not -path "./.buildozer/*" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find .buildozer -name "*.apk" 2>/dev/null | head -1)
          fi
          if [ -n "$APK" ]; then
            echo "Found: $APK ($(du -h "$APK" | cut -f1))"
            cp "$APK" ./TelegramHooker.apk
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "NO APK FOUND"
            ls -laR bin/ 2>/dev/null || echo "No bin/ dir"
            echo "=== Last 100 lines of build log ==="
            tail -100 build.log 2>/dev/null || true
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK
        if: steps.find_apk.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TelegramHooker-Android-v${{ github.run_number }}
          path: ./TelegramHooker.apk
          retention-days: 30

      - name: Release
        if: steps.find_apk.outputs.found == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./TelegramHooker.apk
          draft: false
          prerelease: false
