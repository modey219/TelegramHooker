name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    timeout-minutes: 240
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Encrypt source code
        shell: bash
        run: |
          echo "[*] Encrypting main.py..."
          python encrypt_kivy.py
          cp main_secure.py main.py
          echo "[+] Source encrypted"

      - name: Build APK
        shell: bash
        run: |
          buildozer android debug 2>&1 | tee build.log || true
          echo "Buildozer exit code: ${PIPESTATUS[0]}"
          echo ""
          echo "=== .apk files ==="
          find . -name "*.apk" -exec ls -lh {} \; 2>/dev/null || true
          echo "=== bin/ ==="
          ls -laR bin/ 2>/dev/null || true
          echo "=== Last 50 lines ==="
          tail -50 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 30

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramHooker-v8-${{ github.run_number }}
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: warn
