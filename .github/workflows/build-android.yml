name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake autoconf libltdl-dev \
            libtool curl

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools wheel virtualenv
          pip install buildozer cython

      - name: Build APK
        run: |
          yes | buildozer android debug 2>&1 | tail -100
        continue-on-error: false

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "*.apk" -path "*/bin/*" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" 2>/dev/null | head -1)
          fi
          if [ -n "$APK" ]; then
            echo "apk_path=$APK" >> $GITHUB_OUTPUT
            echo "Found APK: $APK"
            cp "$APK" ./TelegramHooker.apk
          else
            echo "No APK found in build output"
            echo "Listing build directory:"
            ls -la bin/ 2>/dev/null || true
            find . -name "*.apk" 2>/dev/null || true
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramHooker-Android-v${{ github.run_number }}
          path: ./TelegramHooker.apk
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./TelegramHooker.apk
          draft: false
          prerelease: false
