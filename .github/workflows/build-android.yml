name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Buildozer + Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: buildozer-v3-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}
          restore-keys: |
            buildozer-v3-${{ hashFiles('buildozer.spec') }}-
            buildozer-v3-

      - name: Install Buildozer
        run: pip install buildozer cython

      - name: Build APK
        run: |
          buildozer android debug 2>&1 | tee build.log
          echo ${PIPESTATUS[0]} > build_exit.txt

      - name: Upload build log on failure
        if: failure() || steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 5

      - name: Find & Upload APK
        id: upload_apk
        if: success()
        run: |
          EXIT=$(cat build_exit.txt 2>/dev/null || echo "1")
          echo "Buildozer exit: $EXIT"
          if [ "$EXIT" != "0" ]; then
            echo "Buildozer failed, see log above"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          APK=$(find . -name "*.apk" -size +1M 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" ./TelegramHooker.apk
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "NO APK FOUND"
            find . -name "*.apk" -exec ls -lh {} \; 2>/dev/null || true
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifact
        if: steps.upload_apk.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TelegramHooker-v${{ github.run_number }}
          path: ./TelegramHooker.apk
          retention-days: 30

      - name: Release
        if: steps.upload_apk.outputs.found == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./TelegramHooker.apk
